    <text class="layer-title" x="20" y="24">LAYER 1: CLIENT PRESENTATION &amp; ELECTRON DESKTOP RUNTIME</text>
    
    <g transform="translate(20, 52)">
      <rect width="330" height="100" class="comp-box" />
